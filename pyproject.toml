[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-ops"
version = "0.1.0"
description = "Scheduled multi-agent research pipeline (researcher -> analyst -> writer) with run logs, retries and cost tracking."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "abihaasif278" }]
dependencies = [
    "pydantic>=2.6",
    "feedparser>=6.0",
    "httpx>=0.27",
    "apscheduler>=3.10,<4",
    "rich>=13.7",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.70"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
agent-ops = "agent_ops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
